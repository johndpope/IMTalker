<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMTalker - ONNX Runtime Web Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #00d9ff; text-align: center; }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
        }
        .panel h3 { margin-top: 0; color: #00d9ff; }
        canvas, img {
            width: 100%;
            border-radius: 5px;
            background: #0f0f23;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #00b8d9; }
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        #status {
            text-align: center;
            padding: 10px;
            background: #16213e;
            border-radius: 5px;
            margin-top: 20px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #00d9ff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #0f0f23;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <h1>IMTalker - Neural Video Codec</h1>
    <p style="text-align: center; color: #888;">
        Runs entirely in your browser using ONNX Runtime Web (WebGPU/WebGL)
    </p>

    <div class="container">
        <div class="panel">
            <h3>Driving Frame</h3>
            <canvas id="drivingCanvas" width="256" height="256"></canvas>
            <input type="file" id="drivingInput" accept="image/*">
        </div>

        <div class="panel">
            <h3>Reference Frame</h3>
            <canvas id="referenceCanvas" width="256" height="256"></canvas>
            <input type="file" id="referenceInput" accept="image/*">
        </div>

        <div class="panel">
            <h3>Output</h3>
            <canvas id="outputCanvas" width="256" height="256"></canvas>
            <button id="runBtn" disabled>Run Inference</button>
        </div>
    </div>

    <div id="status">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        <span id="statusText">Loading ONNX Runtime...</span>
    </div>

    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>

    <script>
        let session = null;
        let drivingImage = null;
        let referenceImage = null;

        const statusText = document.getElementById('statusText');
        const progressFill = document.getElementById('progressFill');
        const runBtn = document.getElementById('runBtn');

        function setStatus(text, progress = null) {
            statusText.textContent = text;
            if (progress !== null) {
                progressFill.style.width = progress + '%';
            }
        }

        async function loadModel() {
            setStatus('Configuring ONNX Runtime...', 5);

            // Configure execution providers (prefer WebGPU, fallback to WebGL/WASM)
            ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/';

            try {
                setStatus('Loading quantized model (~157MB)...', 10);

                // Load the ONNX model
                const modelUrl = '../exports/full_renderer_quantized.onnx';

                session = await ort.InferenceSession.create(modelUrl, {
                    executionProviders: ['webgpu', 'webgl', 'wasm'],
                    graphOptimizationLevel: 'all'
                });

                setStatus('Model loaded! Select images to run inference.', 100);
                checkReadyToRun();

            } catch (e) {
                setStatus('Error loading model: ' + e.message, 0);
                console.error('Model loading error:', e);
            }
        }

        function imageToTensor(imageData, width, height) {
            // Convert RGBA image data to NCHW float32 tensor
            const data = imageData.data;
            const channels = 3;
            const tensor = new Float32Array(1 * channels * height * width);

            for (let c = 0; c < channels; c++) {
                for (let h = 0; h < height; h++) {
                    for (let w = 0; w < width; w++) {
                        const srcIdx = (h * width + w) * 4 + c;
                        const dstIdx = c * height * width + h * width + w;
                        // Normalize to [0, 1] or [-1, 1] depending on model
                        tensor[dstIdx] = data[srcIdx] / 255.0;
                    }
                }
            }

            return new ort.Tensor('float32', tensor, [1, channels, height, width]);
        }

        function tensorToImage(tensor, canvas) {
            const ctx = canvas.getContext('2d');
            const [batch, channels, height, width] = tensor.dims;
            const data = tensor.data;

            const imageData = ctx.createImageData(width, height);

            for (let h = 0; h < height; h++) {
                for (let w = 0; w < width; w++) {
                    const dstIdx = (h * width + w) * 4;
                    for (let c = 0; c < 3; c++) {
                        const srcIdx = c * height * width + h * width + w;
                        // Denormalize from [0, 1] to [0, 255]
                        imageData.data[dstIdx + c] = Math.min(255, Math.max(0, data[srcIdx] * 255));
                    }
                    imageData.data[dstIdx + 3] = 255; // Alpha
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function loadImageToCanvas(file, canvasId, callback) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.onload = () => {
                // Draw and resize to 256x256
                ctx.drawImage(img, 0, 0, 256, 256);
                const imageData = ctx.getImageData(0, 0, 256, 256);
                callback(imageData);
            };
            img.src = URL.createObjectURL(file);
        }

        function checkReadyToRun() {
            runBtn.disabled = !(session && drivingImage && referenceImage);
        }

        document.getElementById('drivingInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                loadImageToCanvas(e.target.files[0], 'drivingCanvas', (data) => {
                    drivingImage = data;
                    checkReadyToRun();
                });
            }
        });

        document.getElementById('referenceInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                loadImageToCanvas(e.target.files[0], 'referenceCanvas', (data) => {
                    referenceImage = data;
                    checkReadyToRun();
                });
            }
        });

        runBtn.addEventListener('click', async () => {
            if (!session || !drivingImage || !referenceImage) return;

            runBtn.disabled = true;
            setStatus('Running inference...', 50);

            try {
                const startTime = performance.now();

                // Create input tensors
                const drivingTensor = imageToTensor(drivingImage, 256, 256);
                const referenceTensor = imageToTensor(referenceImage, 256, 256);

                // Run inference
                const feeds = {
                    'x_current': drivingTensor,
                    'x_reference': referenceTensor
                };

                const results = await session.run(feeds);

                // Get output (adjust key name based on model output)
                const outputKey = Object.keys(results)[0];
                const outputTensor = results[outputKey];

                // Display result
                tensorToImage(outputTensor, document.getElementById('outputCanvas'));

                const elapsed = (performance.now() - startTime).toFixed(0);
                setStatus(`Inference complete in ${elapsed}ms`, 100);

            } catch (e) {
                setStatus('Inference error: ' + e.message, 0);
                console.error('Inference error:', e);
            }

            runBtn.disabled = false;
        });

        // Start loading model
        loadModel();
    </script>
</body>
</html>
